<!doctype html>
<html lang="{{ alang }}" dir="{{ adir }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>{{ _('تسجيل الدخول') }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/admin.css?v=1"></head>
<body><div class="login"><form class="box" method="post" action="/admin/login">
  <img src="/static/img/logo-mark.png" alt="">
  <h1>{{ _('لوحة التحكم') }}</h1>
  {% if error %}<div class="flash err">{{ _(error) }}</div>{% endif %}
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <div class="f"><label for="u">{{ _('اسم المستخدم') }}</label><input id="u" name="username" autocomplete="username" autofocus required></div>
  <div class="f"><label for="p">{{ _('كلمة المرور') }}</label><input id="p" type="password" name="password" autocomplete="current-password" required></div>
  <button class="btn" style="width:100%">{{ _('دخول') }}</button>
</form>
<a href="/admin/lang/{{ 'en' if alang == 'ar' else 'ar' }}?next=/admin/login" style="position:fixed;top:18px;inset-inline-end:22px;font-size:14px">{{ 'English' if alang == 'ar' else 'العربية' }}</a></div></body></html>
